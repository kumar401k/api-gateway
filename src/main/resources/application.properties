spring.application.name=api-gateway

# Force reactive web application type (required for Spring Cloud Gateway)
spring.main.web-application-type=reactive

# Logging
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# H2 In-Memory Datasource
# Note: DB_CLOSE_DELAY=-1 keeps the DB alive for the duration of the JVM session
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console
# Note: H2 console is servlet-based and may not be accessible via Netty (WebFlux).
# Use an external H2 GUI tool (e.g. DBeaver) connecting to the JDBC URL above.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
